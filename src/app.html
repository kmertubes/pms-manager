<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5f5b">
<link rel="manifest" href="/manifest.json" id="mf">
<script>document.getElementById("mf").href="/manifest.json?e="+encodeURIComponent((location.pathname.split("/").filter(Boolean)[0]||""));</script>
<link rel="icon" href="/icon.svg" type="image/svg+xml">

<title>PMS Manager</title>
<style>
/* Mobile-first : barre d'onglets en haut, cartes empilées, feuilles qui montent du bas */
:root{
  --bg:#eef3f4; --surface:#ffffff; --ink:#0f2a33; --muted:#5b7179; --line:#d6e1e4;
  --accent:#0b5f5b; --accent-ink:#ffffff; --accent-soft:#d9eeec;
  --ok:#1d7a46; --ok-soft:#dcf1e4; --warn:#9a6212; --warn-soft:#f8ead2; --bad:#b4401a; --bad-soft:#f8e0d6; --info:#2a5d9c; --info-soft:#dfe9f6;
  --shadow:0 1px 2px rgba(15,42,51,.06),0 4px 14px rgba(15,42,51,.06);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b171b; --surface:#12242a; --ink:#e4eef0; --muted:#94aab1; --line:#24414a;
  --accent:#35b3a8; --accent-ink:#06211f; --accent-soft:#143a3a;
  --ok:#5fcb8c; --ok-soft:#163a27; --warn:#e3b05c; --warn-soft:#3a2d14; --bad:#f08a66; --bad-soft:#3d1f15; --info:#7fb0ec; --info-soft:#18304d;
  --shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--accent);color:var(--accent-ink);padding-top:env(safe-area-inset-top,0px)}
header.top .row{display:flex;align-items:center;gap:12px;padding-block:12px}
header.top .who{flex:1;min-width:0}
header.top .etab{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .me{font-size:12.5px;opacity:.85}
.iconbtn{background:transparent;border:1px solid currentColor;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:inherit;opacity:.9}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:transparent;color:inherit;opacity:.75;padding:7px 12px;border-radius:999px;font-size:14px;cursor:pointer;position:relative}
nav.tabs button.on{background:var(--accent-ink);color:var(--accent);opacity:1;font-weight:600}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px;font-weight:700}
main{padding-block:16px 96px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px;min-width:0}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.995)}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.line{display:flex;align-items:center;gap:10px;min-width:0}
.line .grow{flex:1;min-width:0}
.title{font-weight:650}
.sub{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.i{background:var(--info-soft);color:var(--info)}
.chip.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:12px 16px;font-weight:650;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:46px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.bad{background:var(--bad);color:#fff}.btn.ok{background:var(--ok);color:#fff}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:9px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.iconbtn:focus-visible,nav.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink)}
textarea.i{min-height:76px;resize:vertical}
.pin{letter-spacing:.5em;text-align:center;font-size:22px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--bg)}
.picker{display:grid;gap:8px}
.pickbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--accent);border-radius:11px;padding:12px;color:var(--accent);font-weight:650;cursor:pointer;background:var(--accent-soft)}
.pickbtn input{position:absolute;width:1px;height:1px;opacity:0}
.check{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}
.piece{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:row;gap:10px;align-items:flex-end}
.fab .btn{box-shadow:0 6px 18px rgba(0,0,0,.18);border-radius:999px}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(5,20,24,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
#sheet .head{display:flex;align-items:flex-start;gap:10px}
#sheet .head h2{flex:1;font-size:19px}
.x{border:0;background:var(--surface);border-radius:999px;width:36px;height:36px;font-size:20px;cursor:pointer;color:var(--ink);flex:none}
#viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center}
#viewer img{max-width:100%;max-height:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
#toast.bad{background:var(--bad);color:#fff}
.login{min-height:100vh;display:grid;align-content:center;gap:18px;padding-block:32px}
.brand{display:grid;gap:4px}
.brand small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.brand h1{font-size:26px}
.punch{display:grid;gap:10px;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px}
.punch .btn{background:var(--accent-ink);color:var(--accent)}
.punch .t{font-size:13px;opacity:.9}
.punch .big{font-size:20px;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th,table.t td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
.scroll{overflow-x:auto}
.note{font-size:12.5px;color:var(--muted)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo>*{min-width:0}
table.pl{border-collapse:separate;border-spacing:3px;font-size:12px;font-variant-numeric:tabular-nums}
table.pl th{font-weight:600;color:var(--muted);padding:2px 4px;white-space:nowrap;text-align:center}
table.pl th.lg{text-align:left;color:var(--ink);font-size:13px;padding-right:8px}
table.pl td.c{width:38px;min-width:38px;height:34px;border-radius:7px;text-align:center;font-weight:700;font-size:12px}
table.pl td.libre{background:var(--bg);border:1px dashed var(--line);cursor:pointer}
table.pl td.r-demande{background:var(--warn-soft);color:var(--warn);cursor:pointer}
table.pl td.r-confirmee{background:var(--muted);color:var(--surface);cursor:pointer}
table.pl td.r-en_cours{background:var(--accent);color:var(--accent-ink);cursor:pointer}
.legende{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legende i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.prod{display:grid;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:10px;cursor:pointer;min-height:64px}
.prod b{color:var(--accent);font-variant-numeric:tabular-nums}
.prod small{color:var(--muted);font-weight:400}
.prod:disabled{opacity:.45;cursor:default}
.prod:active{border-color:var(--accent)}
.qb{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;flex:none}
.q{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.ligne-achat{display:grid;grid-template-columns:1fr 80px 100px;gap:6px;align-items:end}
.ligne-achat .note{grid-column:1/-1;margin-top:-2px}
.fo{border:1px solid var(--line);border-radius:11px;padding:10px;display:grid;gap:8px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.inv{display:grid;grid-template-columns:1fr auto 90px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.inv:last-child{border-bottom:0}
.kv{grid-template-columns:1fr auto}
.kv dd{white-space:nowrap}
table.t td{white-space:nowrap}
.journal{gap:0}
.etape{display:grid;gap:3px;padding:8px 0 8px 12px;border-left:3px solid var(--line);margin-left:2px}
.prod .stk{font-weight:600;font-size:12px;color:var(--muted)}.prod .stk.w{color:var(--warn)}.prod .stk.bad{color:var(--bad)}
.grille{display:grid;grid-template-columns:1fr 150px;gap:6px 10px;align-items:center}
.etape.e-attente{border-left-color:var(--warn)}.etape.e-termine{border-left-color:var(--ok)}.etape.e-reprise{border-left-color:var(--info)}
/* responsive v14 */
html,body{max-width:100%;overflow-x:clip}
main,.card,#sheet .panel,.stats,.duo,.grille,label.f{grid-template-columns:minmax(0,1fr)}
main>*,.card>*,#sheet .panel>*,label.f>*{min-width:0}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.duo{grid-template-columns:repeat(2,minmax(0,1fr))}
.grille{grid-template-columns:minmax(0,1fr) minmax(110px,150px)}
.stat{min-width:0}.stat b{font-size:clamp(17px,5.4vw,26px)}.stat .money{white-space:normal;font-size:clamp(16px,4.8vw,26px)}
.i,input,select,textarea{min-width:0;max-width:100%;box-sizing:border-box}
input[type=date],input[type=time],input[type=datetime-local],input[type=month]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:46px}
.title,.sub,.line .grow,h2,p,dd,dt,label{overflow-wrap:anywhere}
.line{flex-wrap:wrap}.line>.grow{flex:1 1 140px}
.chip{flex:none;max-width:100%}
.seg{max-width:100%}
table{max-width:100%}
.card:has(>table),.card:has(>.t){overflow-x:auto}
#sheet .panel{max-width:100vw;overflow-x:hidden}
img,svg,canvas{max-width:100%}
.kv dt{overflow-wrap:normal;word-break:normal;min-width:0}.kv{grid-template-columns:minmax(0,1fr) auto}
table.t.enc{font-size:13px}table.t.enc th,table.t.enc td{text-align:right;padding:6px 4px}table.t.enc th:first-child,table.t.enc td:first-child{text-align:left;color:var(--muted)}
@media (max-width:380px){.inv{grid-template-columns:minmax(0,1fr) auto 76px}.duo.keep{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app"><div class="wrap login"><div class="brand"><small>PMS Manager by Kmertubes</small><h1>Chargement…</h1></div></div></div>
<div id="sheet" hidden></div>
<div id="viewer" hidden></div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const SB_URL = "https://ahsjgydituniiiregecc.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoc2pneWRpdHVuaWlpcmVnZWNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDc5MzAsImV4cCI6MjEwODY4MzkzMH0.HEW7MRvG2x1Y9n3UgvDFjkSMZxN8TLReApKEz73FMnI";
const DOMAINE = "pms.kmertubes.com";
const TZ = "Africa/Douala";
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

const SLUG = (location.pathname.split("/").filter(Boolean)[0] || new URLSearchParams(location.search).get("e") || "").toLowerCase();
const S = { etab: null, me: null, role: null, membres: [], espaces: [], postes: [], tab: null, pickers: {}, unread: 0 };

const ST = { a_faire:["À faire","n"], en_cours:["En cours","i"], en_attente:["En attente","w"], terminee:["À valider","w"], validee:["Validée","ok"], refusee:["À reprendre","bad"], annulee:["Annulée","n"] };
const ETAT = { propre:["Propre","ok"], sale:["Sale","bad"], en_cours:["Ménage en cours","i"], a_verifier:["À vérifier","w"] };
const PST = { a_faire:["À faire","n"], faite:["Faite","w"], refusee:["À refaire","bad"], validee:["Validée","ok"] };
const SIG = { ouvert:["Ouvert","bad"], pris_en_charge:["Pris en charge","w"], resolu:["Résolu","ok"] };
const CAT = { plomberie:"Plomberie", electricite:"Électricité", materiel_manquant:"Matériel manquant", casse:"Casse", proprete:"Propreté", securite:"Sécurité", autre:"Autre" };
const ROLE = { pdg:"PDG (lecture seule)", directeur:"Directeur", superviseur:"Superviseur", employe:"Employé" };

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const chip = (m, k) => { const v = m[k] || [k, "n"]; return `<span class="chip ${v[1]}">${esc(v[0])}</span>`; };
const today = () => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date());
const debutJour = () => today() + "T00:00:00+01:00";
const heureActuelle = () => new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
const heure = ts => ts ? new Date(ts).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit", timeZone: TZ }) : "";
const dateFr = d => d ? new Date(d + (d.length === 10 ? "T12:00:00" : "")).toLocaleDateString("fr-FR", { weekday:"short", day:"numeric", month:"short", timeZone: TZ }) : "";
const quand = ts => { if (!ts) return ""; const d = new Date(ts); const j = new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(d); return (j === today() ? "aujourd'hui " : dateFr(ts) + " ") + heure(ts); };
const sup = () => ["directeur","superviseur"].includes(S.role);
const dir = () => S.role === "directeur";
const pdg = () => S.role === "pdg";
const nomMembre = id => (S.membres.find(m => m.id === id)?.profils?.nom_complet) || "—";

function toast(msg, bad) {
  const t = $("#toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, bad ? 5000 : 2600);
}
async function q(p) { const { data, error } = await p; if (error) throw new Error(traduire(error.message)); return data; }
async function rpc(n, a) { return q(sb.rpc(n, a)); }
function traduire(m) {
  if (/Invalid login/i.test(m)) return "Numéro ou code PIN incorrect";
  if (/rdv_pas_de_chevauchement/.test(m)) return "Cette esthéticienne a déjà un rendez-vous sur ce créneau";
  if (/reservations_pas_de_chevauchement/.test(m)) return "Ce logement est déjà réservé sur ce créneau";
  if (/row-level security/i.test(m)) return "Vous n'avez pas le droit de faire cette action";
  return m;
}
async function act(btn, fn) {
  if (btn?.disabled) return;
  const old = btn?.innerHTML; if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; }
  try { await fn(); } catch (e) { toast(e.message || "Erreur", true); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}
function normTel(t) {
  let d = String(t || "").replace(/\D/g, "");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.length === 9) d = "237" + d;
  if (d.length < 10 || d.length > 15) throw new Error("Numéro de téléphone invalide");
  return d;
}
async function compte(body) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(SB_URL + "/functions/v1/comptes", { method: "POST",
    headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + (session?.access_token || SB_KEY) },
    body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erreur || "Erreur du serveur");
  return j;
}

/* ---------- feuilles ---------- */
function openSheet(titre, html) {
  const s = $("#sheet");
  s.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="${esc(titre)}"><div class="head"><h2>${esc(titre)}</h2><button class="x" data-act="close" aria-label="Fermer">×</button></div>${html}</div>`;
  s.hidden = false; document.body.style.overflow = "hidden";
}
function closeSheet() { $("#sheet").hidden = true; $("#sheet").innerHTML = ""; document.body.style.overflow = ""; }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
$("#viewer").addEventListener("click", () => { $("#viewer").hidden = true; $("#viewer").innerHTML = ""; });

/* ---------- photos ---------- */
function compresser(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error("Photo illisible")), "image/jpeg", 0.72);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Photo illisible")); };
    img.src = u;
  });
}
function picker(id, label = "Prendre une photo", max = 5) {
  S.pickers[id] = { blobs: [], max };
  return `<div class="picker" data-picker="${id}"><label class="pickbtn">📷 ${esc(label)}<input type="file" accept="image/*" capture="environment" multiple data-pick="${id}"></label><div class="thumbs" id="th-${id}"></div><div class="note" id="nt-${id}">Jusqu'à ${max} photos.</div></div>`;

document.addEventListener("change", async e => {
  const id = e.target.dataset?.pick; if (!id) return;

  for (const f of files) {
    if (p.blobs.length >= p.max) { toast(`Maximum ${p.max} photos`, true); break; }

});
function afficherPicker(id) {

  const kb = Math.round(p.blobs.reduce((s, b) => s + b.size, 0) / 1024);
  $("#nt-" + id).textContent = p.blobs.length ? `${p.blobs.length} photo(s) prête(s), ${kb} Ko au total. Touchez une photo pour la retirer.` : `Jusqu'à ${p.max} photos.`;
}
async function envoyerPhotos(id, type, objet) {
  const p = S.pickers[id]; if (!p || !p.blobs.length) return 0;
  for (const b of p.blobs) {
    const chemin = `${S.etab.id}/${type}/${objet}/${crypto.randomUUID()}.jpg`;
    await q(sb.storage.from("photos").upload(chemin, b, { contentType: "image/jpeg" }));

  }
  const n = p.blobs.length; p.blobs = []; return n;
}
async function photos(type, ids) {

    const pos = await new Promise(res => {
      if (!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition(p => res(p.coords), () => res(null), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
    });
    const r = await rpc("pointer", { p_etablissement: S.etab.id, p_type: type, p_lat: pos?.latitude ?? null, p_lng: pos?.longitude ?? null });
    toast((type === "arrivee" ? "Arrivée" : "Départ") + " enregistré à " + heure(r.horodatage) + (pos ? "" : " (position non disponible)"));
    if (r.dans_perimetre === false) toast(`Attention : vous semblez être à ${r.distance_m} m de la résidence`, true);
    await chargerSession();
  });
}

/* ---------- minuteurs ---------- */
function restant(fin) {
  const m = Math.round((new Date(fin) - Date.now()) / 60000);
  if (m >= 0) return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`;
  return `dépassé de ${-m} min`;
}
setInterval(() => document.querySelectorAll("[data-fin]").forEach(el => {

}), 20000);

async function calculerDispo() {
  const da = S.dispoDa || today(), dd = S.dispoDd || ajoutJours(da, 1);
  const z = $("#dp-res"); if (!z) return;
  z.innerHTML = spinner;
  const nuits = []; for (let j = da; j < dd; j = ajoutJours(j, 1)) nuits.push(j);
  if (!nuits.length) nuits.push(da);
  const rs = await q(sb.from("reservations").select("id,espace_id,debut,fin,statut,formules(mode)")
    .eq("etablissement_id", S.etab.id).in("statut", ["demande", "confirmee", "en_cours"])
    .lt("debut", aDouala(ajoutJours(nuits[nuits.length - 1], 1)).toISOString()).gte("fin", aDouala(da).toISOString()));
  const logs = S.espaces.filter(e => e.type === "logement");
  const occupe = e => rs.some(x => (x.espace_id === e.id || (!e.privatisation && S.espaces.find(s => s.id === x.espace_id)?.privatisation)) && nuits.some(j => couvre(x, j)));
  const libres = logs.filter(e => !occupe(e)), occ = logs.filter(e => occupe(e));
  const z2 = $("#dp-res"); if (!z2) return;
  z2.innerHTML = `<p class="sub">${esc(dateFr(da))} → ${esc(dateFr(dd))} (${nuits.length} nuit${nuits.length > 1 ? "s" : ""})</p>
    <div class="sec">Disponibles (${libres.length})</div>
    ${libres.map(e => `<div class="card tap" ${ecrit() ? `data-act="newresa" data-espace="${e.id}" data-jour="${da}"` : ""}><div class="line"><div class="grow title">${esc(e.nom)}</div><span class="chip ok">Libre</span></div></div>`).join("") || '<div class="empty">Aucun logement libre sur cette période.</div>'}
    ${occ.length ? `<div class="sec">Déjà occupés (${occ.length})</div>${occ.map(e => `<div class="card"><div class="line"><div class="grow title">${esc(e.nom)}</div><span class="chip w">Occupé</span></div></div>`).join("")}` : ""}`;
}
function calculResa(x) {
  const j = $("#r-date").value || today(), h = $("#r-h").value || "13:00";
  const debut = aDouala(j, h);
  const fin = x.mode === "nuitee" ? aDouala(ajoutJours(j, Math.max(1, int("#r-n"))), (x.heure_depart || "11:00").slice(0, 5))
    : new Date(+debut + (x.duree_minutes || 120) * 60000);
  return { debut, fin };
}

async function afficherRecette(id) {

  }
});

  resolu: b => act(b, async () => { await rpc("resoudre_signalement", { p_signalement: b.dataset.id, p_commentaire: $("#r-com").value.trim() || null }); closeSheet(); toast("Problème résolu"); rendre(); }),
  newtask: b => feuilleTache({ espace: b.dataset.espace }),
  creertache: b => act(b, async () => {

    if (!titre) throw new Error("Indiquez ce qu'il faut faire");
    if (!qui) throw new Error("Choisissez la personne");

    const n = await envoyerPhotos("constat", "tache_constat", id);
    closeSheet(); toast(`Tâche envoyée à ${nomMembre(qui)}` + (n ? ` avec ${n} photo(s)` : ""));
  }),

  newmembre: () => feuilleMembre(),
  creermembre: b => act(b, async () => {
    const postes = [...document.querySelectorAll("[data-poste]:checked")].map(x => x.dataset.poste);
    const pin = $("#m-pin").value;
    const r = await compte({ action: "creer_membre", etablissement_id: S.etab.id, nom: $("#m-nom").value.trim(), telephone: $("#m-tel").value, pin, role: $("#m-role").value, postes });

    rendre();
  }),
  postes: b => feuillePostes(b.dataset.id),
  savepostes: b => act(b, async () => {
    const m = S.membres.find(x => x.id === b.dataset.id); const avant = m.membre_postes.filter(x => !x.fin).map(x => x.poste_id);
    const apres = [...document.querySelectorAll("[data-mposte]:checked")].map(x => x.dataset.mposte);
    for (const p of apres.filter(p => !avant.includes(p))) await rpc("attribuer_poste", { p_membre: m.id, p_poste: p });

};

const CATT = { administratif: "Administratif", courrier: "Courrier", fournisseurs: "Fournisseurs", technique: "Technique", menage: "Ménage", securite: "Sécurité", autre: "Autre" };
const FREQ = { quotidienne: "Tous les jours", hebdomadaire: "Chaque semaine", mensuelle: "Chaque mois", annuelle: "Chaque année" };
const JOURS = ["", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
const MOIS = ["", "janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const SUIVI = { creation: "Création", note: "Étape", attente: "En attente", reprise: "Reprise", termine: "Terminée" };
const secretariat = () => sup() || pdg() || (S.me?.postes || []).includes("Secrétariat");
const joursAvant = d => Math.round((new Date(d + "T12:00:00+01:00") - new Date(today() + "T12:00:00+01:00")) / 86400e3);
const echeance = d => { if (!d) return ""; const n = joursAvant(d);
  return `<span class="chip ${n < 0 ? "bad" : n <= 3 ? "w" : "n"}">${n < 0 ? `Dépassée de ${-n} j` : n === 0 ? "À rendre aujourd'hui" : `Limite ${esc(dateFr(d))}`}</span>`; };

function acces(mod) {

  if (pdg()) return "lecture";

/* stock disponible d'un produit vendu, d'après sa fiche recette */
function dispo(pid) {
  const rs = S.recettes.filter(r => r.produit_id === pid);
  if (!rs.length) return null;
  let d = Infinity, seuil = 0;
  for (const r of rs) { const a = S.stockArt[r.article_id]; if (!a) continue;
    d = Math.min(d, Math.floor(Number(a.stock) / Number(r.quantite) + 1e-9)); seuil = Math.max(seuil, Number(a.seuil_alerte) / Number(r.quantite)); }
  return isFinite(d) ? { n: Math.max(d, 0), bas: d > 0 && d <= seuil } : null;
}
function badgeStock(pid) {
  const d = dispo(pid); if (!d) return "";
  return `<small class="stk ${d.n <= 0 ? "bad" : d.bas ? "w" : ""}">${d.n <= 0 ? "Épuisé" : d.n + " en stock"}</small>`;
}

function lireCoords(t) {
  t = String(t || "").trim();
  const m = t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || t.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)
    || t.match(/[?&](?:q|query|ll|center)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/) || t.match(/^(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  const la = +m[1], lo = +m[2];
  return Math.abs(la) <= 90 && Math.abs(lo) <= 180 ? { la, lo } : null;
}

/* ---------- Rendez-vous de l'Institut ---------- */
function prestataires(pid) {
  const ps = S.postes.filter(p => p.pole_id === pid).map(p => p.id);
  const l = S.membres.filter(m => m.actif && m.role !== "pdg" && m.membre_postes.some(x => !x.fin && ps.includes(x.poste_id)));
  return { l: l.length ? l : S.membres.filter(m => m.actif && m.role !== "pdg"), defaut: !l.length };
}
const prestationsInstitut = pid => S.produits.filter(p => caisse(p.caisse_id)?.pole_id === pid && !p.archive)
  .flatMap(p => p.formules.filter(f => f.actif).map(f => ({ p, f, v: p.id + "|" + f.id, l: p.nom + (p.formules.filter(x => x.actif).length > 1 ? " – " + f.nom : "") })));
const caisseSoins = pid => S.caisses.filter(c => c.pole_id === pid && c.type !== "hebergement").sort((a, b) => /soin/i.test(b.nom) - /soin/i.test(a.nom))[0];
const nomPresta = r => { const p = S.produits.find(x => x.id === r.produit_id); return p ? p.nom : "Prestation"; };

async function vRdv() {
  const pi = poleInstitut(); if (!pi) { $("#main").innerHTML = '<div class="empty">Aucun pôle Institut.</div>'; return; }
  const j = S.rdvJour ||= today(), t0 = aDouala(j).toISOString(), t1 = finJour(j);
  const [rv, pt, enc] = await Promise.all([
    q(sb.from("rendez_vous").select("*").eq("pole_id", pi.id).gte("debut", t0).lt("debut", t1).order("debut")),
    q(sb.from("pointages").select("membre_id,type,horodatage").eq("etablissement_id", S.etab.id).gte("horodatage", aDouala(today()).toISOString()).order("horodatage")),
    q(sb.from("rendez_vous").select("id,prestataire,client_nom,commence_le,produit_id").eq("pole_id", pi.id).eq("statut", "en_cours")),
  ]);
  S.rdvs = rv;
  const { l: pers, defaut } = prestataires(pi.id);
  const h0 = +(pi.heure_ouverture || "09").slice(0, 2), h1 = +(pi.heure_fermeture || "19").slice(0, 2);
  const actifs = rv.filter(r => !["annule", "absent"].includes(r.statut));
  const etat = m => {
    const e = enc.find(r => r.prestataire === m.id), dern = pt.filter(p => p.membre_id === m.id).pop();
    const proch = rv.find(r => r.prestataire === m.id && r.statut === "prevu" && new Date(r.debut) > Date.now());
    if (e) return { c: "occ", chip: '<span class="chip w">Occupée</span>', sub: `${esc(e.client_nom || "Cliente")} · depuis ${heure(e.commence_le)}` };
    if (!dern) return { c: "", chip: '<span class="chip n">Pas pointée</span>', sub: proch ? `Prochain RDV ${heure(proch.debut)}` : "" };
    if (dern.type === "depart") return { c: "", chip: '<span class="chip n">Partie</span>', sub: `Départ ${heure(dern.horodatage)}` };
    return { c: "lib", chip: '<span class="chip ok">Libre</span>', sub: proch ? `Prochain RDV ${heure(proch.debut)}` : "Aucun RDV à venir" };
  };
  const creneaux = []; for (let h = h0; h < h1; h++) creneaux.push(`${String(h).padStart(2, "0")}:00`, `${String(h).padStart(2, "0")}:30`);
  const cellule = (m, hh) => {
    const d = aDouala(j, hh), f = new Date(d.getTime() + 30 * 60000);
    const r = actifs.find(x => x.prestataire === m.id && new Date(x.debut) < f && new Date(x.fin) > d);
    if (r) return `<td class="${r.statut} tap" data-act="rdv" data-id="${r.id}" title="${esc(r.client_nom || "")}">${new Date(r.debut) >= d ? esc((r.client_nom || "RDV").split(" ")[0]) : ""}</td>`;
    return `<td class="lb" ${ecrit() ? `data-act="newrdv" data-m="${m.id}" data-h="${hh}"` : ""}></td>`;
  };
  $("#main").innerHTML = `<div class="line"><button class="btn sm ghost" data-act="rdvj" data-d="-1" aria-label="Jour précédent">‹</button>
      <input class="i grow" type="date" id="rdv-j" value="${j}" aria-label="Jour affiché"><button class="btn sm ghost" data-act="rdvj" data-d="1" aria-label="Jour suivant">›</button></div>
    ${ecrit() ? '<button class="btn full" data-act="newrdv">＋ Nouveau rendez-vous</button>' : ""}
    ${j === today() ? `<div class="sec">Qui est libre maintenant ?</div><div class="presta">${pers.map(m => { const e = etat(m);
      return `<div class="card ${e.c}"><div class="title">${esc(m.profils.nom_complet.split(" ").slice(0, 2).join(" "))}</div>${e.chip}<div class="sub">${e.sub}</div></div>`; }).join("")}</div>
      ${defaut ? '<p class="note">Aucun employé n\'a encore de poste à l\'Institut : tout le personnel est affiché. Affectez les esthéticiennes à leur poste dans Personnel.</p>' : ""}` : ""}
    <div class="sec">Agenda · ${esc(dateFr(j))} · ${actifs.length} rendez-vous</div>
    <div class="card scroll"><table class="ag"><thead><tr><th></th>${pers.map(m => `<th>${esc(m.profils.nom_complet.split(" ")[0])}</th>`).join("")}</tr></thead>
      <tbody>${creneaux.map(hh => `<tr><th class="h">${hh.endsWith("00") ? hh : ""}</th>${pers.map(m => cellule(m, hh)).join("")}</tr>`).join("")}</tbody></table>
      <p class="note">Touchez une case vide pour prendre un rendez-vous, une case colorée pour l'ouvrir. Bleu : prévu · orange : en cours · vert : terminé.</p></div>
    <div class="sec">Liste du jour</div>
    ${rv.map(r => `<div class="card tap" data-act="rdv" data-id="${r.id}"><div class="line"><div class="grow"><div class="title">${hDouala(r.debut)}–${hDouala(r.fin)} · ${esc(r.client_nom || "Cliente")}</div>
      <div class="sub">${esc(nomPresta(r))} · ${esc(nomMembre(r.prestataire))}${r.reservation_id ? " · sur la note de la chambre" : ""}</div></div>${chip(RDV, r.statut)}</div>
      ${ecrit() && r.statut === "prevu" ? `<button class="btn sm" data-act="rdvgo" data-id="${r.id}">Début de la prestation</button>` : ""}
      ${ecrit() && r.statut === "en_cours" ? `<button class="btn sm ok" data-act="rdvfin" data-id="${r.id}">Prestation terminée</button>` : ""}</div>`).join("") || '<div class="empty">Aucun rendez-vous ce jour.</div>'}`;
  $("#rdv-j").onchange = e => { if (e.target.value) { S.rdvJour = e.target.value; rendre(); } };
}

/* ---------- Caisse du jour ---------- */
async function etatCaisse(c) {
  const [ses] = await q(sb.from("sessions_caisse").select("*").eq("caisse_id", c.id).order("ouverte_le", { ascending: false }).limit(1));
  const ouverte = ses?.statut === "ouverte" ? ses : null;
  const [mv, esp] = await Promise.all([
    q(ouverte ? sb.from("mouvements_caisse").select("*").eq("session_id", ouverte.id).order("created_at")
      : sb.from("mouvements_caisse").select("*").eq("caisse_id", c.id).gte("created_at", aDouala(today()).toISOString()).order("created_at")),
    ouverte ? q(sb.from("paiements").select("montant,sens").eq("caisse_id", c.id).eq("moyen", "especes").eq("annule", false).gte("created_at", ouverte.ouverte_le)).then(r => r.reduce((t, p) => t + p.montant * (p.sens || 1), 0)) : 0,
  ]);
  const s = k => mv.filter(m => m.type === k && !m.annule).reduce((t, m) => t + m.montant, 0);
  return { ses, ouverte, mv, esp, s, att: ouverte ? ouverte.fond_initial + esp + s("apport") - s("depense") - s("versement_banque") - s("retrait") : 0 };
}
function blocSession(c, e) {
  const o = e.ouverte, w = ecrit();
  const boutons = w ? `<div class="btns"><button class="btn sm ghost" data-act="mvc" data-t="depense">Dépense</button><button class="btn sm ghost" data-act="mvc" data-t="versement_banque">Versement banque</button><button class="btn sm ghost" data-act="mvc" data-t="apport">Apport</button></div>` : "";
  const liste = e.mv.length ? `<div class="sub" style="margin-top:6px">${e.mv.map(m => `<div class="line mvt ${m.annule ? "annule" : ""}"><span class="grow">${heure(m.created_at)} · ${esc(MVC[m.type])} · ${esc(m.libelle)}${m.beneficiaire ? " · " + esc(m.beneficiaire) : ""}${m.reference ? " · n° " + esc(m.reference) : ""}</span>
    <span class="money">${m.type === "apport" ? "+" : "−"} ${fcfa(m.montant)}</span>${dir() && !m.annule ? `<button class="btn sm ghost" data-act="annulmvt" data-k="caisse" data-id="${m.id}">Annuler</button>` : ""}</div>`).join("")}</div>` : "";
  const der = e.ses && e.ses.statut !== "ouverte" ? `Dernière fermeture ${quand(e.ses.fermee_le)} · ${e.ses.ecart ? `écart <b class="${e.ses.ecart < 0 ? "neg" : "pos"}">${fcfa(e.ses.ecart)}</b>` : "sans écart"} · ${SES[e.ses.statut][0].toLowerCase()}.` : "";
  if (o) return `<div class="card" style="border-color:var(--ok)"><div class="line"><div class="grow"><div class="title">Caisse du jour ouverte</div><div class="sub">Depuis ${quand(o.ouverte_le)} par ${esc(nomMembre(o.ouverte_par))}</div></div><span class="chip ok">Ouverte</span></div>
    <dl class="kv"><dt>Fond de caisse</dt><dd class="money">${fcfa(o.fond_initial)}</dd><dt>Encaissé en espèces</dt><dd class="money">${fcfa(e.esp)}</dd>
    ${e.s("apport") ? `<dt>Apports</dt><dd class="money">+ ${fcfa(e.s("apport"))}</dd>` : ""}<dt>Dépenses</dt><dd class="money">− ${fcfa(e.s("depense"))}</dd>
    <dt>Versé à la banque</dt><dd class="money">− ${fcfa(e.s("versement_banque"))}</dd>${e.s("retrait") ? `<dt>Retraits</dt><dd class="money">− ${fcfa(e.s("retrait"))}</dd>` : ""}
    <dt><b>Espèces attendues dans la caisse</b></dt><dd class="money"><b>${fcfa(e.att)}</b></dd></dl>
    ${boutons}${w ? `<button class="btn full" data-act="fermerc" data-id="${o.id}">Fermer la caisse (fin de journée)</button>` : ""}${liste}</div>`;
  if (c.session_obligatoire) return `<div class="card" style="border-color:var(--bad)"><div class="line"><div class="grow"><div class="title">Caisse fermée</div>
    <div class="sub">Ouvrez la caisse du jour pour vendre et encaisser.${der ? "<br>" + der : ""}</div></div><span class="chip bad">Fermée</span></div>
    ${w ? '<button class="btn full" data-act="ouvrirc">Ouvrir la caisse</button>' : ""}${liste}</div>`;
  return `<div class="card"><div class="line"><div class="grow"><div class="title">Caisse du jour</div><div class="sub">Facultatif pour cette caisse : ouvrez-la pour suivre le fond, les dépenses et l'écart à la fermeture.${der ? "<br>" + der : ""}</div></div></div>
    ${w ? '<button class="btn sm ghost" data-act="ouvrirc">Ouvrir la caisse du jour</button>' : ""}${boutons}${liste}</div>`;
}
async function vCaisse2() {

  const e = S.etatC = await etatCaisse(c);

async function optComptes(poleId) {

function feuilleAnticipe(id) {

async function sauverBon(id) {

  docorrtache: b => act(b, async () => {
    const t = S.tacheCour, ch = (a, x) => a === (x || "") ? null : a || null;
    await rpc("corriger_tache", { p_tache: b.dataset.id, p_motif: lireMotif("ct-m"), p_titre: ch($("#ct-t").value.trim(), t.titre), p_assigne: ch($("#ct-a").value, t.assigne_a), p_date: ch($("#ct-d").value, t.date_prevue), p_date_limite: ch($("#ct-l").value, t.date_limite) });
    closeSheet(); toast("Tâche corrigée"); rendre();
  }),
  corrpt: () => feuillePointage(),
  docorrpt: b => act(b, async () => {
    const m = $("#cp-m").value, j = $("#cp-j").value, h = $("#cp-h").value;
    if (!m) throw new Error("Choisissez la personne"); if (!j || !h) throw new Error("Indiquez le jour et l'heure");
    await rpc("corriger_pointage", { p_membre: m, p_type: $("#cp-t").value, p_heure: aDouala(j, h).toISOString(), p_motif: lireMotif("cp-mo"), p_pointage: $("#cp-p").value || null });
    closeSheet(); toast("Pointage corrigé"); rendre();
  }),
  poletab: b => { S.poleTab = b.dataset.p || ""; rendre(); },
  stockvue: b => { S.stockVue = b.dataset.v; rendre(); },
  article: b => feuilleArticle2(b.dataset.id),
  newarticle: () => feuilleArticle2(),
  savearticle: b => act(b, async () => {
    const nom = $("#a-nom").value.trim(); if (!nom) throw new Error("Indiquez le nom");
    const row = { nom, unite: $("#a-u").value, seuil_alerte: num("#a-s"), stock_ideal: num("#a-i"), fournisseur: $("#a-f").value.trim() || null,
      nom_conditionnement: $("#a-cn").value.trim() || null, conditionnement: Math.max(num("#a-cq"), 0.001), caisse_id: $("#a-c").value || null, pole_id: poleDefaut($("#a-c").value) };
    if (b.dataset.id) await q(sb.from("articles_stock").update(row).eq("id", b.dataset.id));
    else await q(sb.from("articles_stock").insert({ ...row, etablissement_id: S.etab.id }));
    closeSheet(); toast("Article enregistré"); rendre();
  }),
  genbons: b => act(b, async () => { const n = await rpc("generer_bons_commande", { p_etablissement: S.etab.id }); toast(n ? `${n} bon(s) de commande préparé(s)` : "Aucun article sous son seuil avec un stock idéal réglé", !n); rendre(); }),
  bon: b => feuilleBon(b.dataset.id),
  savebon: b => act(b, async () => { await sauverBon(b.dataset.id); toast("Bon enregistré"); await vBons(); feuilleBon(b.dataset.id); }),
  validbon: b => act(b, async () => { await sauverBon(b.dataset.id); await rpc("valider_bon", { p_bon: b.dataset.id }); closeSheet(); toast("Bon validé : téléchargez-le en PDF pour l'envoyer"); rendre(); }),
  recevbon: b => act(b, async () => { await rpc("recevoir_bon", { p_bon: b.dataset.id, p_lignes: lignesBon() }); closeSheet(); toast("Marchandise entrée en stock"); rendre(); }),
  annulbon: b => act(b, async () => { await annulerBons([b.dataset.id]); closeSheet(); toast("Bon annulé et archivé"); rendre(); }),
  annultousbons: b => act(b, async () => { const ids = (S.bons || []).filter(x => x.statut !== "recu").map(x => x.id); if (!ids.length) return; await annulerBons(ids); toast(ids.length + " bon(s) annulé(s) et archivé(s)"); rendre(); }),
};

function winAnsi(s) {

}

/* ---------- rapport financier hebdomadaire ---------- */
async function rapportSemaine(jourDans, poleId) {
  const l = lundi(jourDans), jours = [...Array(7)].map((_, i) => ajoutJours(l, i)), dim = jours[6];
  const D = await donneesPole(poleId, debutJ(l), finJ(dim));
  const cls = await q(sb.from("clotures").select("*").eq("pole_id", poleId).gte("jour", l).lte("jour", dim).order("jour"));
  const T = calculs(D), code = D.residence ? "residence" : "institut";
  const parJour = jours.map(j => { const t0 = debutJ(j), t1 = finJ(j), sub = { ...D, pa: D.pa.filter(p => new Date(p.created_at) >= t0 && new Date(p.created_at) < t1), ve: D.ve.filter(v => new Date(v.created_at) >= t0 && new Date(v.created_at) < t1), mv: D.mv.filter(m => new Date(m.created_at) >= t0 && new Date(m.created_at) < t1), anciens: [] }; return { j, c: calculs(sub) }; });
  const dern = cls.filter(c => c.statut === "fermee").pop();
  await avecTheme(code, async th => {
    const f = j => new Date(j + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    const R = new RapportMarque(th, "Rapport financier hebdomadaire", [`Du ${f(l)} au ${f(dim)} ${dim.slice(0, 4)}`]);
    R.sec("Encaissé de la semaine");
    R.kpis([["Caisse (espèces)", fF(T.enc.esp), th.accent], ["OM (Orange Money)", fF(T.enc.om), "#FF7900"], ["MoMo (MTN)", fF(T.enc.momo), "#FFCB05"], ["CAISSE TOTALE", fF(T.enc.tot), th.fonce]]);
    R.sec("Jour par jour");
    R.table([{ t: "Jour", w: 1.8 }, { t: "Recettes", a: "r" }, { t: "Dépenses", a: "r" }, { t: "Caisse totale", a: "r" }],
      parJour.map(x => [f(x.j).replace(/^./, c => c.toUpperCase()), x.c.recT ? fF(x.c.recT) : "RAS", x.c.depT ? fF(x.c.depT) : "-", fF(x.c.enc.tot)]),
      { total: ["TOTAL DE LA SEMAINE", fF(T.recT), fF(T.depT), fF(T.enc.tot)], size: 9 });
    R.sec("Recettes par service");
    R.table([{ t: "Service", w: 3.6 }, { t: "Total", a: "r", w: 1 }], tousServicesPole(D).map(s => T.svc[s] ? { cells: [s, fF(T.svc[s])], bold: true } : { cells: [s, "RAS"], couleur: { 0: KM.gris, 1: KM.gris } }), { total: ["TOTAL DES RECETTES", fF(T.recT)], size: 9 });
    R.y += 6;
    R.table([{ t: "BILAN DE FIN DE SEMAINE" + (dern ? " (" + fD(dern.jour).slice(0, 5) + ")" : ""), w: 3.6 }, { t: "Montant", a: "r", w: 1 }], dern ? [
      ["Report de caisse", fF(dern.report)], ["Orange Money (solde du compte)", dern.solde_om == null ? "non saisi" : fF(dern.solde_om)], ["MoMo (solde du compte)", dern.solde_momo == null ? "non saisi" : fF(dern.solde_momo)],
      ["Caisse du jour", fF(dern.especes_encaissees)], { cells: ["TOTAL CAISSE", fF((dern.report || 0) + (dern.solde_om || 0) + (dern.solde_momo || 0) + (dern.especes_encaissees || 0))], bold: true, fond: th.km.vertc }]
      : [["Aucune caisse fermée cette semaine", ""]], { size: 9 });
    const notes = [...T.cred.map(ligneCredit), ...T.regl.map(r => `Crédit ${r.nom} du ${fD(r.du).slice(0, 5)} : ${fF(r.montant)} réglé cette semaine.`)];
    const ec = cls.filter(c => c.ecart); if (ec.length) notes.push("Écarts de caisse : " + ec.map(c => `${fD(c.jour).slice(0, 5)} ${c.ecart > 0 ? "+" : ""}${fF(c.ecart)}`).join(" · ") + ".");
    if (notes.length) { R.para("Notez bien :", { size: 8, bold: true, color: KM.encre }); notes.forEach(t => R.para("•  " + t, { size: 8, color: KM.encre })); }
    R.sauver(`Rapport-hebdomadaire_${D.residence ? "Residence" : "Institut"}_${l}_${dim}.pdf`);
  });
}

async function blocJournee(c) {

  const D = await donneesPole(pid, debutJ(j), new Date()), Jc = calculs(D, "J"), Nc = calculs(D, "N");
  const nom = pole.code === "residence" ? "Résidence" : pole.nom, st = cl?.statut === "fermee" ? '<span class="chip n">Fermée</span>' : cl?.ouverte_le ? '<span class="chip ok">Ouverte</span>' : '<span class="chip w">Pas encore ouverte</span>';

    <div class="sub">${cl?.ouverte_le ? `Ouverte par ${esc(nomMembre(cl.ouverte_par))} à ${heure(cl.ouverte_le)} · ` : ""}Journée 06 h 30 – 18 h 30 · Nuit 18 h 30 – 06 h 30</div></div>${st}</div>

      <tr><td>Journée</td><td>${nb(Jc.enc.esp, 0)}</td><td>${nb(Jc.enc.om, 0)}</td><td>${nb(Jc.enc.momo, 0)}</td></tr>
      <tr><td>Nuit</td><td>${nb(Nc.enc.esp, 0)}</td><td>${nb(Nc.enc.om, 0)}</td><td>${nb(Nc.enc.momo, 0)}</td></tr></tbody></table>
    <div class="line"><span class="grow"><b>Total encaissé</b></span><b class="money">${fcfa(Jc.enc.tot + Nc.enc.tot)}</b></div>
    ${dir() ? `<div class="btns">${!cl?.ouverte_le ? `<button class="btn" data-act="ouvrirj" data-p="${pid}">Ouvrir la caisse</button>` : ""}<button class="btn ghost" data-act="fermerj" data-p="${pid}">Fermer la caisse</button></div>` : ""}

    ${dir() ? '<p class="note">Le personnel vend à toute heure. Ouvrir rattache à la journée toutes les ventes faites depuis 06 h 30 ; fermer arrête les comptes et prépare le rapport du jour.</p>' : ""}</div>`;
}

/* ======== REÇU DE PAIEMENT (PDF aux couleurs de L'Océane) + ENVOI WHATSAPP ======== */
const fcfaPdf = n => String(Math.round(Math.abs(Number(n) || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " FCFA";
function enLettres(n) {
  n = Math.round(Math.abs(n));
  const u = ["zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize"];
  const d = ["", "dix", "vingt", "trente", "quarante", "cinquante", "soixante"];
  const c99 = (x, fin = true) => {
    if (x < 17) return u[x];
    if (x < 20) return "dix-" + u[x - 10];
    if (x < 70) { const t = Math.floor(x / 10), r = x % 10; return d[t] + (r === 0 ? "" : r === 1 ? " et un" : "-" + u[r]); }
    if (x < 80) return "soixante" + (x === 71 ? " et onze" : "-" + c99(x - 60));
    const r = x - 80; return "quatre-vingt" + (r === 0 ? (fin ? "s" : "") : "-" + c99(r));
  };
  const c999 = (x, fin) => {
    const h = Math.floor(x / 100), r = x % 100; let s = "";
    if (h) s = (h > 1 ? u[h] + " cent" : "cent") + (h > 1 && r === 0 && fin ? "s" : "");
    if (r) s += (s ? " " : "") + c99(r, fin);
    return s;
  };
  if (n === 0) return "zéro";
  const mi = Math.floor(n / 1e6), mil = Math.floor(n % 1e6 / 1000), r = n % 1000; let s = [];
  if (mi) s.push(c999(mi, true) + (mi > 1 ? " millions" : " million"));
  if (mil) s.push(mil === 1 ? "mille" : c999(mil, false) + " mille");
  if (r) s.push(c999(r, true));
  return s.join(" ");
}

  const prods = S.produits.filter(p => p.disponible && caisse(p.caisse_id)?.type !== "hebergement" && caisse(p.caisse_id)?.pole_id && S.poles.find(x => x.id === caisse(p.caisse_id).pole_id)?.code === "residence");
  const tri = (a, b) => (PRESTA_CAT.includes(b.categorie) - PRESTA_CAT.includes(a.categorie)) || (a.categorie || "").localeCompare(b.categorie || "") || a.nom.localeCompare(b.nom);
  prods.sort(tri);
  const nuits = r.debut ? Math.max(1, Math.round((aDouala(jourDe(r.fin)) - aDouala(jourDe(r.debut))) / 864e5)) : 1;
  openSheet("Ajouter au séjour", `
    <label class="f">Prestation<select class="i" id="ps-p">${prods.map(p => `<option value="${p.id}">${esc((p.categorie ? p.categorie + " · " : "") + p.nom)}</option>`).join("")}</select></label>
    <label class="f">Formule / prix<select class="i" id="ps-f"></select></label>
    <div class="duo"><label class="f">Personnes<input class="i" type="number" inputmode="numeric" min="1" id="ps-n" value="${r.nb_personnes || 1}"></label>
    <label class="f">Jours / fois<input class="i" type="number" inputmode="numeric" min="1" id="ps-j" value="1" data-nuits="${nuits}"></label></div>
    <div class="duo"><label class="f">Prix unitaire (FCFA)<input class="i" type="number" inputmode="numeric" id="ps-pu"></label><label class="f">Date<input class="i" type="date" id="ps-d" value="${today()}"></label></div>
    <div class="card"><div class="line"><span class="grow sub" id="ps-calc"></span><b class="money" id="ps-tot"></b></div></div>
    <p class="note">La prestation est ajoutée à la note du séjour : elle apparaîtra sur la facture et dans le reste à payer. Elle est comptée dans la caisse de la prestation (Restaurant pour la pension, Loisirs & excursions pour les activités).</p>
    <button class="btn full" data-act="dopresta" data-id="${id}">Ajouter à la note</button>`);
  const majF = () => { const p = S.produits.find(x => x.id === $("#ps-p").value), fs = (p?.formules || []).filter(f => f.actif);
    $("#ps-f").innerHTML = fs.map(f => `<option value="${f.id}" data-prix="${f.prix}">${esc(f.nom)} · ${fcfa(f.prix)}</option>`).join("");
    const parPers = fs.some(f => /personne/i.test(f.nom)), sortie = fs.some(f => /sortie|forfait|heure|journée/i.test(f.nom));
    $("#ps-n").value = sortie && !parPers ? 1 : (r.nb_personnes || 1);
    $("#ps-j").value = p?.categorie === "Pension" ? $("#ps-j").dataset.nuits : 1;
    $("#ps-pu").value = fs[0]?.prix || 0; calc(); };
  const calc = () => { const n = int("#ps-n") || 1, j = int("#ps-j") || 1, pu = int("#ps-pu");
    $("#ps-calc").textContent = `${n} pers. × ${j} ${j > 1 ? "jours/fois" : "jour/fois"} × ${fcfa(pu)}`; $("#ps-tot").textContent = fcfa(n * j * pu); };
  $("#ps-p").onchange = majF; $("#ps-f").onchange = () => { $("#ps-pu").value = $("#ps-f").selectedOptions[0]?.dataset.prix || 0; calc(); };
  ["#ps-n", "#ps-j", "#ps-pu"].forEach(s => $(s).oninput = calc);
  majF();
}

/* ---------- données de la note ---------- */
async function donneesNote(id) {
  const [r, ve, fa] = await Promise.all([
    q(sb.from("reservations").select("id,espace_id,debut,fin,arrivee_reelle,depart_reel,nb_personnes,prix_total,statut,clients(nom,telephone),formules(nom,mode,prix)").eq("id", id).single()),
    q(sb.from("ventes").select("id,caisse_id,total,statut,created_at,vente_lignes(id,quantite,prix_unitaire,detail,created_at,produits(nom,categorie),formules(nom))").eq("reservation_id", id).neq("statut", "annulee").order("created_at")),
    q(sb.from("factures").select("numero,version,emise_le,total,paye,reste").eq("reservation_id", id).order("emise_le")),
  ]);
  const vids = ve.map(v => v.id);
  const [p1, p2] = await Promise.all([
    q(sb.from("paiements").select("montant,sens,moyen,reference_transaction,est_acompte,created_at,recu_par,vente_id").eq("reservation_id", id).eq("annule", false)),
    vids.length ? q(sb.from("paiements").select("montant,sens,moyen,reference_transaction,est_acompte,created_at,recu_par,vente_id").in("vente_id", vids).eq("annule", false)) : [],
  ]);
  const vus = new Set(), pa = [...p1, ...p2].filter(p => { const k = p.created_at + p.montant + p.moyen; if (vus.has(k)) return false; vus.add(k); return true; }).sort((a, b) => a.created_at.localeCompare(b.created_at));
  const nuits = Math.max(1, Math.round((aDouala(jourDe(r.fin)) - aDouala(jourDe(r.debut))) / 864e5));
  const lignes = [];
  const nuitee = r.formules?.mode === "nuitee";
  lignes.push({ grp: "Hébergement", date: r.arrivee_reelle || r.debut, lib: `${nomEspace(r.espace_id)} · ${r.formules?.nom || "Séjour"}`, det: `du ${fD(jourDe(r.debut))} au ${fD(jourDe(r.fin))}`,
    qte: nuitee && r.prix_total % nuits === 0 ? nuits : 1, pu: nuitee && r.prix_total % nuits === 0 ? r.prix_total / nuits : r.prix_total, tot: r.prix_total, unite: nuitee && r.prix_total % nuits === 0 ? "nuit" : "", le: r.debut });
  ve.forEach(v => (v.vente_lignes || []).forEach(l => {
    const L = { ...l, caisse_id: v.caisse_id };
    lignes.push({ grp: estPresta(L) ? "Prestations" : "Consommations", date: v.created_at, lib: (l.produits?.nom || "Article") + (l.formules?.nom && l.formules.nom !== "Forfait" ? " · " + l.formules.nom : ""),
      det: l.detail || caisse(v.caisse_id)?.nom || "", qte: l.quantite, pu: l.prix_unitaire, tot: Math.round(l.quantite * l.prix_unitaire), le: l.created_at || v.created_at });
  }));
  const total = lignes.reduce((t, l) => t + l.tot, 0), paye = pa.reduce((t, p) => t + p.montant * (p.sens || 1), 0);
  return { r, ve, fa, pa, lignes, total, paye, reste: total - paye, nuits };
}

  y += 26;

  y += 22;
  // colonnes : Date | Désignation | Qté | P.U. | Montant

  d.wrap(`Arrêtée la présente note à la somme de ${enLettres(N.total)} francs CFA, dont ${enLettres(Math.max(0, N.paye))} francs CFA déjà versés.`, 8, false, W - 2 * M).forEach(t => { d.text(t, M, y, { size: 8, color: encre }); y += 11; });

}

/* ---------- envoi (WhatsApp, partage, téléchargement) ---------- */
async function deposerPdf(blob, prefixe) {
  const chemin = `${S.etab.id}/${prefixe}-${[...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2, "0")).join("")}.pdf`;
  const { error } = await sb.storage.from("recus").upload(chemin, blob, { contentType: "application/pdf", upsert: false });
  if (error) throw error;
  return sb.storage.from("recus").getPublicUrl(chemin).data.publicUrl;
}
function blocEnvoi(tel, msg, lien) {
  const peut = !!(navigator.canShare && navigator.canShare({ files: [S.recu.file] }));
  return `<label class="f">WhatsApp du client<input class="i" id="en-tel" type="tel" inputmode="tel" value="${tel ? esc(telAff(tel)) : ""}" placeholder="6XX XX XX XX"></label>
    ${lien ? `<a class="btn full" id="en-wa" target="_blank" rel="noopener">Envoyer par WhatsApp</a>` : '<p class="note">Le lien n\'a pas pu être créé (connexion ?). Utilisez « Partager le PDF ».</p>'}

async function emettreNote(id) {
  const N = S.note || await donneesNote(id), version = N.fa.length + 1, F = pdfNote(N, version);
  const fichier = `Facture-${F.numero}${version > 1 ? "-v" + version : ""}.pdf`;
  S.recu = { file: new File([F.blob], fichier, { type: "application/pdf" }), fichier };
  let lien = ""; try { lien = await deposerPdf(F.blob, F.numero + "-v" + version); } catch (e) { console.warn(e); }
  await q(sb.from("factures").insert({ etablissement_id: S.etab.id, reservation_id: id, numero: F.numero, version, total: N.total, paye: N.paye, reste: N.reste, lien: lien || null, emise_par: S.me.membre_id }));

/* ---------- encaisser le reste de la note (consommations d'abord, puis séjour) ---------- */
async function payerNote(id, p) {
  const N = await donneesNote(id); let reste = p.montant;
  for (const v of N.ve) {
    if (reste <= 0) break;
    const du = v.total - N.pa.filter(x => x.vente_id === v.id).reduce((t, x) => t + x.montant * (x.sens || 1), 0);
    if (du <= 0) continue;
    const m = Math.min(du, reste);
    await rpc("enregistrer_paiement", { p_etablissement: S.etab.id, p_montant: m, p_moyen: p.moyen, p_vente: v.id, p_reference: p.ref });
    reste -= m;
  }
  if (reste > 0) await rpc("enregistrer_paiement", { p_etablissement: S.etab.id, p_montant: reste, p_moyen: p.moyen, p_reservation: id, p_reference: p.ref, p_est_acompte: false });
}

/* ======== TABLEAU DE BORD CAISSE RÉSIDENCE ========
   Date, Report, Hébergement, Bar, Piscine, Resto, Crédits, Dépenses, Versement, Solde en caisse.
   Calculé en direct depuis ventes/paiements/achats/clotures (ne dépend d'aucune mise à jour manuelle).
   Visible dans Tableau (pôle Résidence) et dans Finances › Caisse Résidence.
   Ne touche jamais au pôle Institut / Luxury Beauty - Paris. */
function poleResidence() { return S.poles.find(p => p.code === "residence"); }
const crJourActif = () => S.crJour || jourCompta();

async function donneesCaisseResidence(jour) {
  const pole = poleResidence(); if (!pole) return null;
  const [clArr, prevArr] = await Promise.all([
    q(sb.from("clotures").select("*").eq("pole_id", pole.id).eq("jour", jour).limit(1)),
    q(sb.from("clotures").select("*").eq("pole_id", pole.id).lt("jour", jour).order("jour", { ascending: false }).limit(1)),
  ]);
  const cl = clArr[0] || null, prev = prevArr[0] || null;
  const D = await donneesPole(pole.id, debutJ(jour), finJ(jour));
  const T = calculs(D);
  const ach = await q(sb.from("achats").select("id,total,libelle,caisse_id").in("caisse_id", D.ids).eq("annule", false).eq("date_achat", jour));
  const achT = ach.reduce((t, a) => t + (a.total || 0), 0);
  const depenses = T.depT + achT;
  const report = cl?.report ?? (prev ? (prev.especes_comptees ?? prev.especes_attendues ?? 0) : 0);
  const versement = T.recT - depenses;
  const solde = report + versement;
  const credT = T.cred.reduce((t, c) => t + c.montant, 0);
  const pocheConnue = cl && (cl.report_cash != null || cl.solde_om != null || cl.solde_momo != null || cl.report_acomptes != null);
  const pocheTot = pocheConnue ? Number(cl.report_cash || 0) + Number(cl.solde_om || 0) + Number(cl.solde_momo || 0) + Number(cl.report_acomptes || 0) : null;
  return { pole, cl, prev, D, T, ach, achT, depenses, report, versement, solde, credT, pocheTot, jour };
}

async function finCaisseResidence() {
  const jour = crJourActif(), C = await donneesCaisseResidence(jour);
  if (!C) return '<div class="empty">Aucun pôle Résidence configuré.</div>';
  const { T, cl } = C, svc = k => T.svc[k] || 0;
  const tuile = (label, val, k, neg) => `<div class="stat tap" data-act="crcat" data-k="${esc(k)}"><b class="money ${neg || val < 0 ? "neg" : ""}">${fcfa(val)}</b><span>${esc(label)}</span></div>`;
  const ecartPoche = C.pocheTot != null ? C.pocheTot - C.report : null;
  return `
    <div class="navj"><button class="btn ghost" data-act="crjour" data-d="-1" aria-label="Jour précédent">‹</button>
      <input class="i" type="date" id="cr-d" value="${jour}" max="${jourCompta()}">

    <p class="sub">Résidence · ${esc(dateFr(jour))}${cl?.statut === "fermee" ? ' <span class="chip n">Journée fermée</span>' : ""}</p>
    <div class="card" style="border-color:var(--accent)">
      <div class="sec" style="margin:0">Report de caisse</div><b class="money" style="font-size:22px">${fcfa(C.report)}</b>
      ${C.pocheTot != null
        ? `<div class="line" style="flex-wrap:wrap;gap:8px 16px"><span class="sub">Cash <b>${fcfa(cl.report_cash || 0)}</b></span><span class="sub">OM <b>${fcfa(cl.solde_om || 0)}</b></span><span class="sub">MoMo <b>${fcfa(cl.solde_momo || 0)}</b></span><span class="sub">Acomptes <b>${fcfa(cl.report_acomptes || 0)}</b></span></div>
          ${ecartPoche ? `<p class="note">Écart de ${fcfa(Math.abs(ecartPoche))} entre le report et la somme des poches${cl?.commentaire ? " — voir commentaire" : ""}.</p>` : ""}`
        : '<p class="note">Répartition Cash / OM / MoMo / Acomptes pas encore saisie pour ce jour.</p>'}
    </div>
    <div class="stats">
      ${tuile("Hébergement", svc("Hébergement"), "Hébergement")}
      ${tuile("Bar", svc("Bar"), "Bar")}
      ${tuile("Piscine", svc("Piscine"), "Piscine")}
      ${tuile("Resto", svc("Restaurant"), "Restaurant")}
      ${T.svc["Restaurant mobile"] ? tuile("Resto mobile", svc("Restaurant mobile"), "Restaurant mobile") : ""}
      ${T.svc["Loisirs & excursions"] ? tuile("Loisirs", svc("Loisirs & excursions"), "Loisirs & excursions") : ""}
      ${tuile("Crédits (ventes non payées)", C.credT, "credits", true)}
      ${tuile("Dépenses", C.depenses, "depenses", true)}
      <div class="stat"><b class="money ${C.versement >= 0 ? "pos" : "neg"}">${fcfa(C.versement)}</b><span>Versement (recettes − dépenses)</span></div>
      <div class="stat"><b class="money">${fcfa(C.solde)}</b><span>Solde en caisse</span></div>
    </div>
    <p class="note">Versement = recettes de la journée − dépenses. Solde en caisse = report + versement. Touchez une case pour voir le détail, ligne par ligne.</p>`;
}

}

async function vVenteInstitut() {
  const pi = poleInstitut();
  const cs = S.caisses.filter(c => c.type !== "hebergement" && voitPole(c.pole_id) && (!pi || c.pole_id === pi.id));
  if (!cs.length) { $("#main").innerHTML = '<div class="empty">Aucune caisse de vente configurée pour l\'Institut.</div>'; return; }
  if (!cs.some(c => c.id === S.caisseSel)) S.caisseSel = cs[0].id;
  const c = caisse(S.caisseSel), depuis = aDouala(today()).toISOString();
  const [ve, enc] = await Promise.all([
    q(sb.from("ventes").select("id,total,statut,lieu,created_at,vendeur,reservation_id,vente_lignes(quantite,produits(nom))").eq("caisse_id", c.id).gte("created_at", depuis).order("created_at", { ascending: true })),
    q(sb.from("paiements").select("montant,sens,moyen,vente_id").eq("caisse_id", c.id).eq("annule", false).gte("created_at", depuis)).then(signe),
  ]);
  const paye = id => enc.filter(p => p.vente_id === id).reduce((t, p) => t + p.montant, 0);
  const total = enc.reduce((t, p) => t + p.montant, 0);
  $("#main").innerHTML = `${cs.length > 1 ? `<div class="seg">${cs.map(x => `<button data-act="caisse" data-id="${x.id}" class="${x.id === c.id ? "on" : ""}">${esc(x.nom)}</button>`).join("")}</div>` : ""}
    <div class="stats"><div class="stat"><b class="money">${fcfa(total)}</b><span>encaissé aujourd'hui</span></div><div class="stat"><b>${ve.filter(v => v.statut !== "annulee").length}</b><span>vente(s) aujourd'hui</span></div></div>
    ${ecrit() ? `<div class="btns"><button class="btn full" data-act="newvente">＋ Nouvelle vente</button><button class="btn ghost" data-act="mvc" data-t="depense">Dépense</button></div>` : ""}
    <div class="sec">Ventes du jour</div>
    ${ve.map(v => { const reste = v.total - paye(v.id); return `<div class="card tap" data-act="vente" data-id="${v.id}"><div class="line"><div class="grow">
      <div class="title">${esc(v.vente_lignes.map(l => (Number(l.quantite) !== 1 ? nb(l.quantite) + " × " : "") + l.produits.nom).join(", ") || "Vente")}</div>
      <div class="sub">${heure(v.created_at)}${v.lieu ? " · " + esc(v.lieu) : ""} · ${esc(nomMembre(v.vendeur))}</div></div><b class="money">${fcfa(v.total)}</b></div>
      <div class="line">${chip(VST, v.statut)}${v.statut !== "annulee" && reste > 0 ? `<span class="chip w">À encaisser ${fcfa(reste)}</span>` : ""}</div></div>`; }).join("") || '<div class="empty">Aucune vente aujourd\'hui.</div>'}`;
  $("#main").insertAdjacentHTML("beforeend", await blocMainCouranteInstitut(pi));
}
function perMI() {
  const du = S.miDu || today(), au = S.miAu || today();
  return du <= au ? [du, au] : [au, du];
}
async function blocMainCouranteInstitut(pi) {
  if (!pi) return "";
  const [du, au] = perMI();
  let D; try { D = await donneesMainCourante(du, au, pi.id); } catch (e) {
    return `<div class="sec">Main courante</div>
      <div class="duo"><label class="f">Du<input class="i" type="date" id="mi-du" value="${du}" max="${today()}"></label><label class="f">Au<input class="i" type="date" id="mi-au" value="${au}" max="${today()}"></label></div>
      <div class="empty">${esc(e.message)}</div>`;
  }
  const jours = []; for (let j = du; j <= au; j = ajoutJours(j, 1)) jours.push(j);
  const jr = ts => jourCompta(new Date(ts));
  const sortie = m => ["depense", "retrait", "versement_banque"].includes(m.type);
  const lignes = [];
  let rep = D.report;
  for (const j of jours) {
    const rec = D.pa.filter(p => jr(p.created_at) === j);
    const dep = D.mv.filter(m => jr(m.created_at) === j && sortie(m)).reduce((t, m) => t + m.montant, 0);
    const app = D.mv.filter(m => jr(m.created_at) === j && m.type === "apport").reduce((t, m) => t + m.montant, 0);
    if (app) { lignes.push({ j, rep, poste: "Apport en caisse", pr: "/", r: app, d: 0 }); rep += app; }
    if (!rec.length && !dep) continue;
    if (!rec.length) { lignes.push({ j, rep, poste: "/", pr: "/", r: null, d: dep }); rep -= dep; continue; }
    rec.forEach((p, i) => { const v = D.ve[p.vente_id], m = p.montant * (p.sens || 1), d = i === rec.length - 1 ? dep : 0;
      lignes.push({ j, rep, poste: poste(v), pr: prestaDe(v), r: m, d }); rep += m - d; });
  }
  const recT = D.pa.reduce((t, p) => t + p.montant * (p.sens || 1), 0);
  const appT = D.mv.filter(m => m.type === "apport").reduce((t, m) => t + m.montant, 0);
  const depT = D.mv.filter(sortie).reduce((t, m) => t + m.montant, 0);
  const solde = D.report + recT + appT - depT;
  const rows = lignes.map(l => `<tr><td>${ddmmyyyy(l.j)}</td><td class="money">${fcfa(l.rep)}</td><td>${esc(l.poste)}</td><td>${esc(l.pr)}</td><td class="money">${l.r === null ? "—" : fcfa(l.r)}</td><td class="money">${l.d ? fcfa(l.d) : "—"}</td></tr>`).join("");
  return `<div class="sec">Main courante</div>
    <div class="duo"><label class="f">Du<input class="i" type="date" id="mi-du" value="${du}" max="${today()}"></label><label class="f">Au<input class="i" type="date" id="mi-au" value="${au}" max="${today()}"></label></div>
    <div class="card scroll"><table class="t"><thead><tr><th>Dates</th><th>Report de caisse</th><th>Poste</th><th>Prestataire</th><th>Recettes</th><th>Dépenses</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6" class="empty">Aucun mouvement sur cette période.</td></tr>'}
    <tr class="tot"><td><b>TOTAL</b></td><td></td><td></td><td></td><td class="money"><b>${fcfa(recT + appT)}</b></td><td class="money"><b>${fcfa(depT)}</b></td></tr>
    </tbody></table></div>
    <div class="line"><b>TOTAL MAIN COURANTE</b><b class="money">${fcfa(solde)}</b></div>
    ${ecrit() ? `<button class="btn full ghost" data-act="rapportjourinst" data-id="${pi.id}">📄 Générer le rapport de cette période (PDF)</button>` : ""}`;
}
document.addEventListener("change", e => {
  if (e.target.id === "mi-du" || e.target.id === "mi-au") { if (!e.target.value) return; S[e.target.id === "mi-du" ? "miDu" : "miAu"] = e.target.value; vVenteInstitut().catch(err => toast(err.message, true)); }
});
function perID() {
  const du = S.idDu || lundi(today()), au = S.idAu || today();
  return du <= au ? [du, au] : [au, du];
}
async function blocInstitutAccueil(pi) {
  const hier = ajoutJours(today(), -1);
  const [T, Ty] = await Promise.all([
    syntheseGenerale(today(), today(), pi.id),
    syntheseGenerale(hier, hier, pi.id),
  ]);
  const delta = T.solde - Ty.solde, bon = delta >= 0;
  const l = (a, v, cls = "") => `<dt>${a}</dt><dd class="money ${cls}">${fcfa(v)}</dd>`;
  const synth = `<div class="card synth"><dl class="kv">
      ${l(`Report au ${dateFr(today())}`, T.report)}
      ${l("Recettes du jour", T.rec)}
      ${T.app ? l("Apports en caisse", T.app) : ""}
      ${l("<b>Total général</b>", T.general)}
      ${l("Investissement", T.inv, T.inv ? "neg" : "")}
      ${l("Fonctionnement", T.fon, T.fon ? "neg" : "")}
      ${T.cot ? l("Cotisations (épargne)", T.cot, "neg") : ""}
      ${T.vers ? l("Versé à la banque", T.vers) : ""}</dl>
      <div class="solde"><span>Total main courante (à jour)</span><span class="money">${fcfa(T.solde)}</span></div></div>
    <p class="sub">${bon ? "📈 Bénéfice" : "📉 Perte"} de ${fcfa(Math.abs(delta))} par rapport à hier.</p>`;
  const [du, au] = perID();
  return `${synth}
    <div class="sec">Performance et dépenses de la semaine</div>
    <div class="duo"><label class="f">Du<input class="i" type="date" id="id-du" value="${du}" max="${today()}"></label><label class="f">Au<input class="i" type="date" id="id-au" value="${au}" max="${today()}"></label></div>
    ${await blocPerformanceInstitut(pi, du, au)}`;
}
function matriceInstitut(titre, jours, data) {
  const ks = Object.keys(data);
  if (!ks.length) return `<div class="sec">${titre}</div><div class="empty">Aucune donnée sur cette période.</div>`;
  const totCol = jours.map(j => ks.reduce((t, k) => t + (data[k][j] || 0), 0));
  const totGen = totCol.reduce((a, b) => a + b, 0);
  return `<div class="sec">${titre}</div><div class="card scroll"><table class="t"><thead><tr><th></th>${jours.map(j => `<th>${jsem(j).slice(0, 3)}<br>${ddmm(j)}</th>`).join("")}<th>TOTAL</th></tr></thead>
    <tbody>${ks.map(k => { const tot = jours.reduce((t, j) => t + (data[k][j] || 0), 0);
      return `<tr><td>${esc(k)}</td>${jours.map(j => `<td class="money">${data[k][j] ? fcfa(data[k][j]) : "—"}</td>`).join("")}<td class="money"><b>${fcfa(tot)}</b></td></tr>`; }).join("")}
    <tr class="tot"><td><b>TOTAL FCFA</b></td>${totCol.map(v => `<td class="money"><b>${fcfa(v)}</b></td>`).join("")}<td class="money"><b>${fcfa(totGen)}</b></td></tr></tbody></table></div>`;
}
async function blocPerformanceInstitut(pi, du, au) {
  let D; try { D = await donneesMainCourante(du, au, pi.id); } catch (e) { return `<div class="empty">${esc(e.message)}</div>`; }
  const jours = []; for (let j = du; j <= au; j = ajoutJours(j, 1)) jours.push(j);
  const jr = ts => jourCompta(new Date(ts));
  const nomsPresta = new Set(Object.values(D.ve).map(v => (v.prestataire || "").trim().toLowerCase()).filter(Boolean));
  const empDe = m => (m.employe || "").trim() || (m.beneficiaire && nomsPresta.has(m.beneficiaire.trim().toLowerCase()) ? m.beneficiaire.trim() : "");
  const depEmp = m => !!empDe(m);
  const sortie = m => ["depense", "retrait", "versement_banque"].includes(m.type);
  const perf = {};
  D.pa.forEach(p => { const k = prestaDe(D.ve[p.vente_id]), j = jr(p.created_at);
    (perf[k] ||= {})[j] = (perf[k][j] || 0) + p.montant * (p.sens || 1); });
  const depE = {}; Object.keys(perf).forEach(k => depE[k] = {});
  const depI = {};
  D.mv.filter(sortie).forEach(m => { const j = jr(m.created_at);
    if (depEmp(m)) { const k = Object.keys(perf).find(x => x.toLowerCase() === empDe(m).toLowerCase()) || empDe(m); (depE[k] ||= {})[j] = (depE[k][j] || 0) + m.montant; }
    else { const k = m.type === "versement_banque" ? "Versement banque" : (m.categorie || m.libelle || "Divers").trim(); (depI[k] ||= {})[j] = (depI[k][j] || 0) + m.montant; } });
  return `${matriceInstitut("Performance par employé", jours, perf)}${matriceInstitut("Dépenses par employé", jours, depE)}${matriceInstitut("Dépenses Institut", jours, depI)}`;
}
document.addEventListener("change", e => {
  if (e.target.id === "id-du" || e.target.id === "id-au") { if (!e.target.value) return; S[e.target.id === "id-du" ? "idDu" : "idAu"] = e.target.value; instTableauBord().catch(err => toast(err.message, true)); }
});

}
@media (min-width:1200px){

}
</style>`);
